<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Required meta tags -->
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Bootstrap Grid Challenge</title>

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Bootstrap Grid Challenge
        </h1>

        <!-- Bootstrap row -->
        <div class="row">

            <!-- First column -->
            <div class="col-md-6 bg-info text-white p-4">

                <h2>First Column</h2>

                <p>
                    This is the first column created with the
                    Bootstrap grid system.
                </p>

            </div>

            <!-- Second column -->
            <div class="col-md-6 bg-secondary text-white p-4">

                <h2>Second Column</h2>

                <p>
                    This is the second column created with the
                    Bootstrap grid system.
                </p>

            </div>

        </div>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js">
    </script>

    <!-- Bootstrap 4 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
