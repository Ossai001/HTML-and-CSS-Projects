<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Table</title>
    <link rel="stylesheet" href="CSS_Table.css">
</head>

<body>

    <h2>My Styled Table</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Country</th>
        </tr>

        <tr>
            <td>John</td>
            <td>25</td>
            <td>UK</td>
        </tr>

        <tr>
            <td>Mary</td>
            <td>30</td>
            <td>USA</td>
        </tr>

        <tr>
            <td>David</td>
            <td>28</td>
            <td>Canada</td>
        </tr>
    </table>

</body>
</html>
