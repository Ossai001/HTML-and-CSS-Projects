<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Play Ultimate Tic Tac Toe Online!</title>

    <!-- Connects the HTML page to the game stylesheet. -->
    <link rel="stylesheet" href="CSS/game.css">
</head>

<body id="body">

    <h1>ULTIMATE TIC TAC TOE GAME</h1>

    <p class="instructions">
        You are X. Click an empty square to begin the game.
    </p>

    <!-- This container holds both the table and the canvas. -->
    <div class="center-container">

        <!-- The canvas displays the winning line. -->
        <canvas
            id="win-lines"
            width="608"
            height="608"
        ></canvas>

        <!-- The table creates the nine game squares. -->
        <table>
            <tr>
                <td id="0" onclick="placeXOrO('0')"></td>
                <td id="1" onclick="placeXOrO('1')"></td>
                <td id="2" onclick="placeXOrO('2')"></td>
            </tr>

            <tr>
                <td id="3" onclick="placeXOrO('3')"></td>
                <td id="4" onclick="placeXOrO('4')"></td>
                <td id="5" onclick="placeXOrO('5')"></td>
            </tr>

            <tr>
                <td id="6" onclick="placeXOrO('6')"></td>
                <td id="7" onclick="placeXOrO('7')"></td>
                <td id="8" onclick="placeXOrO('8')"></td>
            </tr>
        </table>
    </div>

    <p id="game-message">Your turn!</p>

    <!-- Connects the HTML page to the JavaScript file. -->
    <script src="js/tictactoe.js"></script>
</body>

</html>
