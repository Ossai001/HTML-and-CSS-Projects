<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic HTML 1</title>
</head>
<body>

    <h1>Welcome to My Page</h1>

    <!-- Image with alt attribute -->
    <img src="image.jpg" alt="A beautiful scenery with mountains and a lake" width="300">

    <!-- Existing formatted text -->
    <p>
        <font face="Arial" size="2" color="blue">
            <b>This is bold text (size 2).</b>
        </font>
    </p>

    <p>
        <font face="Verdana" size="4" color="#FF5733">
            <i>This is italic text (size 4).</i>
        </font>
    </p>

    <p>
        <font face="Courier New" size="6" color="green">
            <u>This is underlined text (size 6).</u>
        </font>
    </p>

    <!-- New paragraph -->
    <p>Added another paragraph.</p>

    <script src="Basic_JavaScript_1.js"></script>

</body>
</html>
